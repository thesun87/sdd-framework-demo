entry_criteria_notes: >-
  CV001 — the handoff examples in protocol A15/B8 omit ux_spec, so the
  generator matches the example but not the rule the protocol states (:1831,
  HV013). The rule wins over an illustrative example.

  CV006 — HV013/HV013b are handoff gates, not feature acceptance criteria, but
  extending them to ux_spec changes when a handoff passes. Mitigated as in
  SDD-003: the gate only gets stronger, no new rule id is introduced, and tests
  pin both directions (a spec without a ux-spec dependency still passes).
  Existing handoffs for 001–003 will FAIL if revalidated; that is the defect
  surfacing, and regenerating them is out of scope here.

  CV010 — three source files in the glue layer (sdd_lib.py holds the one
  "depends on ux-spec" predicate both consumers share; sdd_handoff.py,
  sdd_validate.py) plus their two test files, on the precedent of SDD-002 and
  SDD-003.

  The CONTESTED CV006 was put to the human (Tuan Nguyen, 2026-09-25) before
  any code was written, together with the option of escalating to Track B, and
  Track C was chosen.

  Out of scope, raised to the human instead: adding a UX_REFS field to the
  task-brief contract (protocol §2) is a protocol change, not a defect fix.
root_cause: >-
  Two faults, both present since the bootstrap commit d7424d8.

  (1) scripts/sdd/sdd_handoff.py:97-113 hardcodes the `baseline:` block for
  both tracks to exactly prd, architecture, glossary — a transcription of the
  illustrative handoffs in protocol A15/B8. No code path asks which baseline
  artifacts the spec actually depends on, so ux-spec.md (a frozen artifact per
  baseline-freeze.yaml) is never pinned, and context.include never names its
  sections. Task briefs built from that context carry no visual contract.

  (2) scripts/sdd/sdd_validate.py:104-111 applies HV013/HV013b only to
  ("spec", "plan", "tasks"). A dependency the handoff forgot to capture is
  invisible to the validator, and a captured baseline artifact would never be
  checked for staleness either. So the omission in (1) passes /sdd-validate.

  The fix: the generator pins baseline.ux_spec and adds
  referenced_ux_spec_sections whenever spec.md cites ux-spec.md; the
  validator extends HV013/HV013b to ux_spec under the same condition.

  Known remaining gap, NOT fixed here: fault (2) also means the pinned prd,
  architecture and glossary nodes get no HV013b staleness check. Out of this
  change unit's expected behaviour; recorded as a follow-up.
