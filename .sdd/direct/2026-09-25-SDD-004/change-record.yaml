defect:
  observed: >-
    specs/001-catalog-browse, 002-accounts and 003-cart-and-wall each declare a
    dependency on docs/baseline/ux-spec.md in their spec.md baseline
    references, yet every generated handoff.yaml pins only prd, architecture
    and glossary under `baseline:` and lists no UX context under
    `context.include`. /sdd-validate passes those handoffs. Consequence seen in
    the product: task execution never received the visual contract (ux-spec.md
    Part 1 design tokens, layout, linked mockups); packages/ui/src/tokens.ts
    carries an invented palette (#1A1A1A, #1E4620, #7A271A) instead of the
    baseline tokens (#0070CE, #F4F5F6, …) and the storefront does not match
    the mockups. A later change to ux-spec.md would also not mark any handoff
    STALE.
  expected: >-
    When spec.md depends on ux-spec.md, the handoff pins it
    (baseline.ux_spec: path + git_sha) and context.include names
    referenced_ux_spec_sections — sharded sections, never the whole document,
    matching referenced_architecture_sections. /sdd-validate FAILs HV013 when
    such a handoff has no captured ux_spec SHA, and HV013b when the pinned SHA
    no longer matches ux-spec.md (STALE). A spec that does not cite
    ux-spec.md is unaffected.
  documented_behaviour_ref: >-
    docs/agentic-sdd-protocol-v2.md:1831 ("Every handoff records path +
    version + git_sha for each artifact it depends on"), :1833-1845 (staleness
    detection on any changed artifact SHA), §7 HV013 ("artifact versions and
    git SHAs are captured"); docs/baseline/baseline-freeze.yaml artifacts.ux_spec
    (ux-spec.md is a frozen baseline artifact).
  reproduction: >-
    tests/sdd_handoff.test.mjs — "Track A handoff pins ux_spec when spec.md
    depends on it", "Track B handoff pins ux_spec when spec.md depends on it"
    (red before the fix); "handoff does not pin ux_spec when spec.md does not
    cite it" (guard, green throughout). tests/sdd_validate.test.mjs — "HV013
    blocks a handoff missing ux_spec for a spec that depends on it", "HV013b
    blocks a STALE handoff when ux-spec.md changes afterwards" (red before the
    fix); after review: "HV013 tells the operator to commit ux-spec.md when the
    pinned node has no SHA", "HV013b checks the canonical ux-spec.md, not
    whatever path the handoff names" (red before the review fix); "a handoff
    pinning ux_spec for a spec that depends on it passes" (guard).
