defect:
  observed: >-
    /sdd-validate on the Track A handoff for 000-walking-skeleton reports
    "BV003 spec FRs with no PRD origin: FR-001, FR-002, FR-003, FR-004, FR-005,
    FR-006, FR-007, FR-008" — every declared requirement in the spec — although
    spec.md carries an explicit back-reference for each one (e.g.
    "- **FR-001** *(← PRD FR-4)*"). The feature cannot be handed off at all.
    In the same run BV003 silently accepts FR-14, which appears in spec.md only
    inside an out-of-scope note ("Đặt đơn là FR-14, thuộc feature 004") and
    belongs to feature 004, because that string happens to occur in prd.md.
  expected: >-
    BV003 implements the rule the protocol states at line 1907 — "every spec FR
    traces to a PRD FR-xxx". A declared spec FR is traced when it carries a
    back-reference resolving to an FR that exists in prd.md. A declared spec FR
    with no back-reference, or one pointing at an FR absent from prd.md, still
    FAILs. An FR-shaped string appearing only in prose is not a declared
    requirement and is neither checked nor credited.
  documented_behaviour_ref: >-
    docs/agentic-sdd-protocol-v2.md:1907 (BV003 "every spec FR traces to a PRD
    FR-xxx" — "traces to", not "has an identical id");
    .specify/templates/spec-template.md:90-94 (installer-managed, mandates
    spec-local FR-001 numbering, therefore spec.md is conformant and the
    validator is not).
  reproduction: >-
    tests/sdd_validate.test.mjs — "BV003 accepts a spec FR traced by a
    (← PRD FR-N) back-reference", "BV003 resolves a back-reference to a
    single-digit PRD FR", "BV003 still blocks a declared spec FR with no
    back-reference", "BV003 does not credit an FR mentioned only in prose".
    All red before the fix.
