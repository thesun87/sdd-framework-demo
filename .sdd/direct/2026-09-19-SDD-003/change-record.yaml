entry_criteria_notes: >-
  CV006 — BV003 is a handoff quality gate, not a feature acceptance criterion,
  but changing when it passes does change a gate. Mitigated by making the gate
  strictly stronger, never weaker: a declared spec FR with no back-reference
  now FAILs where a lucky string collision previously passed (the FR-14 case
  above), and a back-reference pointing at an FR absent from prd.md FAILs.
  Tests pin both directions, so the gate cannot be relaxed unnoticed.

  CV010 — two source files, sdd_lib.py and sdd_validate.py, plus one test file.
  Treated as one module (the glue layer), on the precedent of SDD-002. The
  regex lives in sdd_lib.py and its only defective consumer is BV003 in
  sdd_validate.py; splitting the change would leave the rule reading a set the
  helper still builds wrong.

  Both stretches were put to the human before any code was written, together
  with the option of escalating to Track B, and Track C was chosen.
root_cause: >-
  find_ids (scripts/sdd/sdd_lib.py:95-97, unchanged since the bootstrap commit
  d7424d8) extracts requirement ids with \b{prefix}-?\d{2,4}\b. Three faults
  compose in BV003 (scripts/sdd/sdd_validate.py:128-133).

  (1) The two-digit floor makes prd.md's FR-1 … FR-9 invisible: prd_frs holds
  26 of the PRD's 35 requirements. Feature 000 traces exclusively to FR-4 and
  FR-5 — both inside the invisible nine — so the rule could not have passed
  even if the ids had matched.

  (2) BV003 tests raw string membership (f in prd_frs), which assumes spec FR
  ids share a namespace with PRD FR ids. The Spec Kit template mandates
  spec-local FR-001 numbering and is installer-managed, so the two namespaces
  can never coincide by construction. The real trace is the *(← PRD FR-N)*
  back-reference, which BV003 never reads. Numeric normalisation is not a fix
  and is actively wrong: FR-001 normalises onto PRD FR-1 (catalog browse,
  feature 001) while it actually traces to PRD FR-4.

  (3) The input set is find_ids(spec_txt, "FR") — every FR-shaped string
  anywhere in the document, including cross-feature mentions in out-of-scope
  notes. So the rule is false-negative on all eight declared requirements and
  false-positive on FR-14, which belongs to another feature.

  The fix lowers the floor to one digit, and makes BV003 read declared
  requirements and their back-references instead of comparing raw id strings.
