# ops/compose.yaml — toàn bộ hệ thống Shop Online: MỘT VPS, MỘT Docker Compose, MỘT origin
# (AD-8). Ba dịch vụ: `postgres` (dữ liệu thật), `api` (NestJS, không publish cổng — chỉ
# `proxy` nói chuyện với nó), `proxy` (Caddy, cổng HTTP DUY NHẤT publish ra ngoài).
#
# AD-27 — PostgreSQL thật, cùng major với prod. Không pg-mem, không SQLite, không repository
# giả cho đường chạm dữ liệu.
#
# AD-28 — kỷ luật cô lập test: `postgres` là dịch vụ DÙNG CHUNG cho cả chạy thật lẫn test,
# KHÔNG dựng lại mỗi lần chạy test. Test tranh chấp (*.race-spec.ts) dọn dữ liệu bằng
# TRUNCATE, KHÔNG BAO GIỜ bằng transaction rollback (rollback gộp nhiều connection độc lập
# vào một transaction, làm tranh chấp biến mất — xanh một cách vô nghĩa). Không có database
# thứ hai "cho test" ở đây — đó chính là điều AD-27 cấm.
#
# AD-16 — phụ thuộc runtime CHỈ PostgreSQL + hệ tệp cục bộ. Không Redis, không message
# broker, không dịch vụ thứ tư.

name: shop-online

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    ports:
      # Publish ra host để Jest — chạy TRÊN HOST, ngoài container — nối thẳng vào được.
      # Test chạm tồn kho chạy trên PostgreSQL thật (AD-27), không phải bản sao riêng.
      - "5432:5432"
    volumes:
      # Named volume: dữ liệu sống qua `compose down` (không phải volume ẩn danh gắn theo
      # vòng đời container). Mount tại /var/lib/postgresql (không phải .../data) — ảnh
      # postgres 18+ tự đặt dữ liệu vào thư mục con theo tên major version bên trong đó
      # (pg_ctlcluster-style); mount thẳng vào .../data khiến entrypoint từ chối khởi động.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # Build context là GỐC REPO (Ruling R5) — resolve tương đối so với thư mục chứa file
      # compose này (ops/), nên `..` = gốc repo.
      context: ..
      dockerfile: ops/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # Đường dẫn tương đối so với thư mục chứa file compose này (ops/).
      - .env.example
    environment:
      # Ghi đè riêng cho dịch vụ này: BÊN TRONG mạng compose, `api` nối tới `postgres` qua
      # tên dịch vụ, không phải "localhost" (localhost trong container là chính container
      # đó). Tên biến vẫn là DATABASE_URL — không đặt tên khác (R4); chỉ giá trị khác theo
      # ngữ cảnh mạng.
      DATABASE_URL: postgres://app:app@postgres:5432/shop
    volumes:
      # Ảnh sản phẩm nằm trên hệ tệp (AD-15), không phải blob trong database. Đường dẫn lấy
      # từ PRODUCT_IMAGE_PATH; mặc định dùng khi biến chưa được set trong môi trường gọi
      # `docker compose` (compose không tự nạp ops/.env.example cho việc thay thế biến ở
      # file YAML này — chỉ `env_file:` ở trên bơm nó vào container; muốn giá trị khác ở
      # chính dòng này, chạy với `--env-file ops/.env.example` hoặc copy thành `ops/.env`).
      - product-images:${PRODUCT_IMAGE_PATH:-/data/product-images}
    # Không publish cổng ra host — AD-8 (một origin): chỉ `proxy` publish HTTP ra ngoài.

  proxy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      # ops/Caddyfile là file của T003 — CHƯA tồn tại khi task này chạy. Tham chiếu nó ở
      # đây là đúng theo brief; T003 tạo nó ngay sau. Đường dẫn tương đối so với thư mục
      # chứa file compose này (ops/), nên `./Caddyfile` = ops/Caddyfile — không cần vòng
      # qua gốc repo (`../ops/Caddyfile`) rồi quay lại cùng thư mục.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/storefront/dist:/srv/storefront:ro
      # Mount cùng named volume ảnh sản phẩm, chỉ đọc, phòng trường hợp Caddy phục vụ ảnh
      # tĩnh trực tiếp thay vì đi qua `api` (quyết định thực sự thuộc Caddyfile của T003).
      - product-images:${PRODUCT_IMAGE_PATH:-/data/product-images}:ro

volumes:
  postgres-data:
  product-images:
